name: Apply UI fit patch

on:
  push:
    branches: [ui-full-fit]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-full-fit
      - name: Patch viewport metrics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/utils/lib.js')
          s = p.read_text()
          old = """export const WINDOW_INNER_HEIGHT = window.innerHeight;\nexport const WINDOW_INNER_WIDTH = window.innerWidth;\nexport const scaleMultiplier = WINDOW_INNER_HEIGHT / 768.0;"""
          new = """export const DESIGN_WIDTH = 1024;\nexport const DESIGN_HEIGHT = 768;\nconst rawViewportWidth = window.innerWidth;\nconst rawViewportHeight = window.innerHeight;\nconst fitStage = ['index', 'home', 'editor', 'gettingStarted'].indexOf(window.scratchJrPage) > -1;\nexport const scaleMultiplier = fitStage\n    ? Math.min(rawViewportWidth / DESIGN_WIDTH, rawViewportHeight / DESIGN_HEIGHT)\n    : rawViewportHeight / DESIGN_HEIGHT;\nexport const WINDOW_INNER_HEIGHT = fitStage ? DESIGN_HEIGHT * scaleMultiplier : rawViewportHeight;\nexport const WINDOW_INNER_WIDTH = fitStage ? DESIGN_WIDTH * scaleMultiplier : rawViewportWidth;"""
          if old not in s:
              raise SystemExit('viewport metrics block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/utils/lib.js
          git diff --cached --quiet && exit 0
          git commit -m "Fit ScratchJr viewport without stretching"
          git push origin HEAD:ui-full-fit
